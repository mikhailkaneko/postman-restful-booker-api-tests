name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run API test suite (Newman)
        run: npm run test:ci

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-junit-report
          path: report/junit-report.xml
          retention-days: 14
